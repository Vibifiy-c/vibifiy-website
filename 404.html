<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Vibifiy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .error-container {
            text-align: center;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a020f0 0%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 1rem;
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }
        
        .error-title {
            font-size: 2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 1rem;
        }
        
        .error-message {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .redirect-notice {
            background: rgba(160, 32, 240, 0.1);
            border: 1px solid rgba(160, 32, 240, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
            color: #a020f0;
            font-size: 0.9rem;
        }
        
        .home-link {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #a020f0 0%, #d946ef 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .home-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(160, 32, 240, 0.4);
        }
        
        .logo {
            margin-bottom: 2rem;
        }
        
        .logo svg {
            width: 60px;
            height: 60px;
        }
    </style>
    
    <!-- THIS IS THE SCRIPT THAT HANDLES THE REDIRECT -->
    <script>
        // Save the path the user tried to visit
        sessionStorage.setItem('vibifiy_redirect', window.location.pathname + window.location.search);
        
        // Redirect to the homepage (root domain) after a short delay
        setTimeout(() => {
            window.location.href = '/';
        }, 3000);
    </script>
</head>
<body>
    <div class="error-container">
        <div class="logo">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="20" fill="url(#gradient)"/>
                <path d="M30 70L50 30L70 70" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="gradient" x1="0" y1="0" x2="100" y2="100">
                        <stop offset="0%" stop-color="#a020f0"/>
                        <stop offset="100%" stop-color="#d946ef"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Page Not Found</h2>
        <p class="error-message">
            Oops! The page you're looking for doesn't exist or has been moved.
        </p>
        
        <div class="redirect-notice">
            ⏳ Redirecting you to Vibifiy homepage...
        </div>
        
        <a href="/" class="home-link">Go to Homepage</a>
    </div>
</body>
</html>
